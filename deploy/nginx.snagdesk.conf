# SnagDesk — nginx for snagdesk.cravingcodetech.in (CloudPanel VPS)
#
# Live site usually lives under CloudPanel:
#   root: /home/snagdesk/htdocs/snagdesk.cravingcodetech.in
#   API:  backend/.env PORT=4010 (4000 may be used by other apps)
#
# Prefer editing the CloudPanel-managed site so the panel does not overwrite
# SSH-only changes. Keep this file as reference for /api + /uploads proxy.

upstream snagdesk_api {
    server 127.0.0.1:4010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name snagdesk.cravingcodetech.in;

    # Certbot ACME
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    root /home/snagdesk/htdocs/snagdesk.cravingcodetech.in;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://snagdesk_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://snagdesk_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# After Let's Encrypt, HTTPS should mirror the /api and /uploads blocks above
# with root pointing at the same htdocs path.
