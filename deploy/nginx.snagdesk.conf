# SnagDesk — nginx for snagdesk.cravingcodetech.in
#
# 1) Copy this file (HTTP-only first) so certbot can issue a cert:
#      sudo cp deploy/nginx.snagdesk.conf /etc/nginx/sites-available/snagdesk
#      sudo ln -sf /etc/nginx/sites-available/snagdesk /etc/nginx/sites-enabled/
#      # disable old IP-only site if it conflicts
#      sudo nginx -t && sudo systemctl reload nginx
#
# 2) Issue Let's Encrypt cert (needs DNS A record → VPS):
#      sudo certbot --nginx -d snagdesk.cravingcodetech.in
#
# Certbot will add ssl_certificate lines + HTTPS listen. Keep this as the
# HTTP→HTTPS + reverse-proxy baseline if you prefer manual SSL blocks.
#
# WEB_ROOT should match deploy.sh (default: repo frontend/dist).

upstream snagdesk_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name snagdesk.cravingcodetech.in;

    # Certbot ACME
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Until cert exists, serve the app over HTTP (optional).
    # After certbot, this block is usually redirected to HTTPS.
    root /opt/propinspect/frontend/dist;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://snagdesk_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://snagdesk_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# After `certbot --nginx`, you should also have (or add) an HTTPS server:
