name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-}"
          PORT="${VPS_PORT:-}"
          HOST="${HOST:-147.93.30.96}"
          PORT="${PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer a pinned known_hosts secret (works even when GitHub cannot keyscan).
          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Loaded known_hosts from VPS_SSH_KNOWN_HOSTS secret."
            exit 0
          fi

          echo "Trying ssh-keyscan ${HOST}:${PORT}..."
          if ssh-keyscan -T 15 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            if grep -qE 'ssh-(rsa|ed25519)|ecdsa-' ~/.ssh/known_hosts; then
              echo "known_hosts updated via ssh-keyscan."
              exit 0
            fi
          fi

          echo "ssh-keyscan failed (often Hostinger firewall blocking GitHub Actions IPs):"
          cat /tmp/keyscan.err || true
          echo "Falling back to StrictHostKeyChecking=accept-new for this run."
          echo "ACCEPT_NEW=1" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-}"
          USER="${VPS_USER:-}"
          PORT="${VPS_PORT:-}"
          PATH_ON_VPS="${DEPLOY_PATH:-}"
          APP_NAME="${PM2_APP_NAME:-}"
          WEB="${WEB_ROOT:-}"

          HOST="${HOST:-147.93.30.96}"
          USER="${USER:?Set secret VPS_USER (e.g. deploy)}"
          PORT="${PORT:-22}"
          PATH_ON_VPS="${PATH_ON_VPS:?Set secret DEPLOY_PATH (e.g. /home/deploy/apps/PropInspect)}"
          APP_NAME="${APP_NAME:-propinspect-api}"

          SSH_OPTS=(
            -p "$PORT"
            -o ServerAliveInterval=30
            -o ConnectTimeout=30
          )

          if [ "${ACCEPT_NEW:-}" = "1" ]; then
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts)
          else
            SSH_OPTS+=(-o StrictHostKeyChecking=yes)
          fi

          echo "Deploying to ${USER}@${HOST}:${PORT} path=${PATH_ON_VPS} pm2=${APP_NAME}"

          # Quick connectivity check with a clear error if the firewall blocks GitHub.
          if ! ssh "${SSH_OPTS[@]}" -o BatchMode=yes "${USER}@${HOST}" "echo ssh_ok"; then
            echo "::error::SSH from GitHub Actions to ${HOST}:${PORT} failed."
            echo "Open SSH (port ${PORT}) to 0.0.0.0/0 in Hostinger firewall / IP allowlist,"
            echo "or allow GitHub Actions IP ranges. Also confirm VPS_SSH_PRIVATE_KEY is correct."
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            "export DEPLOY_PATH='${PATH_ON_VPS}' PM2_APP_NAME='${APP_NAME}' WEB_ROOT='${WEB}' GIT_BRANCH='main'; bash -s" \
            < scripts/deploy.sh
