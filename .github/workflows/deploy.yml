name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-}"
          PORT="${VPS_PORT:-}"
          HOST="${HOST:-147.93.30.96}"
          PORT="${PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Loaded known_hosts from secret."
            exit 0
          fi

          echo "Scanning ${HOST}:${PORT}..."
          if ssh-keyscan -T 15 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err \
            && grep -qE 'ssh-(rsa|ed25519)|ecdsa-' ~/.ssh/known_hosts; then
            echo "known_hosts updated via ssh-keyscan."
            exit 0
          fi

          echo "ssh-keyscan failed:"
          cat /tmp/keyscan.err || true
          echo "ACCEPT_NEW=1" >> "$GITHUB_ENV"
          echo "Will use StrictHostKeyChecking=accept-new"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-}"
          USER="${VPS_USER:-}"
          PORT="${VPS_PORT:-}"
          PATH_ON_VPS="${DEPLOY_PATH:-}"
          APP_NAME="${PM2_APP_NAME:-}"
          WEB="${WEB_ROOT:-}"

          HOST="${HOST:-147.93.30.96}"
          USER="${USER:?Set secret VPS_USER}"
          PORT="${PORT:-22}"
          PATH_ON_VPS="${PATH_ON_VPS:?Set secret DEPLOY_PATH}"
          APP_NAME="${APP_NAME:-propinspect-api}"

          SSH_OPTS=(
            -p "$PORT"
            -o ServerAliveInterval=30
            -o ConnectTimeout=45
            -o BatchMode=yes
          )

          if [ "${ACCEPT_NEW:-}" = "1" ]; then
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new)
          else
            SSH_OPTS+=(-o StrictHostKeyChecking=yes)
          fi

          echo "Deploying to ${USER}@${HOST}:${PORT} path=${PATH_ON_VPS} pm2=${APP_NAME}"

          if ! ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" "echo ssh_ok"; then
            echo "::error::SSH timed out or was refused."
            echo "Hostinger panel firewall looks open — also check ON the VPS:"
            echo "  sudo ufw status"
            echo "  sudo iptables -L INPUT -n | head -40"
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            "export DEPLOY_PATH='${PATH_ON_VPS}' PM2_APP_NAME='${APP_NAME}' WEB_ROOT='${WEB}' GIT_BRANCH='main' PATH=\"\$HOME/.nvm/versions/node/default/bin:\$HOME/.local/bin:/usr/local/bin:\$PATH\"; bash -s" \
            < scripts/deploy.sh
