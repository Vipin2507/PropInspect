name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # CloudPanel VPS (snagdesk.cravingcodetech.in)
          HOST="${VPS_HOST:-69.62.84.237}"
          PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Always fetch keys for the *current* host (avoids stale VPS_SSH_KNOWN_HOSTS
          # left over from an old IP after migration).
          echo "Scanning ${HOST}:${PORT}..."
          if ssh-keyscan -T 15 -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err \
            && grep -qE 'ssh-(rsa|ed25519)|ecdsa-' ~/.ssh/known_hosts; then
            echo "known_hosts updated via ssh-keyscan."
            exit 0
          fi

          echo "ssh-keyscan failed:"
          cat /tmp/keyscan.err || true

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Fell back to VPS_SSH_KNOWN_HOSTS secret."
            exit 0
          fi

          echo "ACCEPT_NEW=1" >> "$GITHUB_ENV"
          echo "Will use StrictHostKeyChecking=accept-new"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          WEB_ROOT: ${{ secrets.WEB_ROOT }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-69.62.84.237}"
          USER="${VPS_USER:?Set secret VPS_USER (e.g. root or snagdesk)}"
          PORT="${VPS_PORT:-22}"
          PATH_ON_VPS="${DEPLOY_PATH:-/home/snagdesk/apps/PropInspect}"
          APP_NAME="${PM2_APP_NAME:-propinspect-api}"
          WEB="${WEB_ROOT:-/home/snagdesk/htdocs/snagdesk.cravingcodetech.in}"

          SSH_OPTS=(
            -p "$PORT"
            -o ServerAliveInterval=30
            -o ConnectTimeout=45
            -o BatchMode=yes
          )

          if [ "${ACCEPT_NEW:-}" = "1" ]; then
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new)
          else
            SSH_OPTS+=(-o StrictHostKeyChecking=yes)
          fi

          echo "Deploying to ${USER}@${HOST}:${PORT} path=${PATH_ON_VPS} web=${WEB} pm2=${APP_NAME}"

          if ! ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" "echo ssh_ok"; then
            echo "::error::SSH timed out or was refused."
            echo "Check VPS firewall / ufw and that secrets VPS_HOST / VPS_USER / VPS_SSH_PRIVATE_KEY match the new server."
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            "export DEPLOY_PATH='${PATH_ON_VPS}' PM2_APP_NAME='${APP_NAME}' WEB_ROOT='${WEB}' GIT_BRANCH='main' PATH=\"\$HOME/.nvm/versions/node/default/bin:\$HOME/.local/bin:/usr/local/bin:\$PATH\"; bash -s" \
            < scripts/deploy.sh
